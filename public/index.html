<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloQ Challenge · Amigos</title><style>
:root{--bg:#0d0f0a;--card:#161a10;--line:#2a3020;--tx:#f2f5e8;--mut:#8b9578;--ac:#E9FF1F;--up:#5dff8f;--dn:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}h1{margin:0;font-size:28px}h1 span{background:var(--ac);color:#0d0f0a;padding:0 8px;border-radius:6px}
.sub{color:var(--mut);margin:6px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--mut)}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row:first-child{border-color:var(--ac)}.pos{font-size:20px;font-weight:800;text-align:center}.av{display:flex;gap:10px;align-items:center}
.av img{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--line)}.nm{font-weight:700}.nm a{color:inherit;text-decoration:none}
.rk{color:var(--mut);font-size:13px}.gain{text-align:right;font-weight:800;font-size:18px}.gain small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
</style></head><body><main>
<h1>SoloQ <span>Challenge</span></h1><p class="sub">Quién sube más hasta el 31 de diciembre 🍻</p>
<div class="stats"><div class="stat"><b id="d">–</b><small>días restantes</small></div><div class="stat"><b id="n">–</b><small>jugadores</small></div><div class="stat"><b id="t">–</b><small>líder</small></div></div>
<div id="l"></div><div class="foot" id="u"></div></main><script>
const TN={IRON:'Hierro',BRONZE:'Bronce',SILVER:'Plata',GOLD:'Oro',PLATINUM:'Platino',EMERALD:'Esmeralda',DIAMOND:'Diamante',MASTER:'Master',GRANDMASTER:'Grandmaster',CHALLENGER:'Challenger'};
const fmt=r=>r?`${TN[r.tier]}${r.tier.match(/MASTER|CHALL/)?'':' '+r.rank} · ${r.lp} LP`:'Sin rango';
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
 const j=await (await fetch('/api/players')).json();
 const ps=j.players.sort((a,b)=>(b.gain??-1e9)-(a.gain??-1e9));
 n.textContent=ps.length;t.textContent=ps[0]?ps[0].riotId.split('#')[0]:'–';
 d.textContent=Math.max(0,Math.ceil((new Date('2026-12-31T23:59:59')-new Date())/864e5));
 l.innerHTML=ps.map((p,i)=>{const [nm,tg]=p.riotId.split('#');const g=p.gain;
  const ic=p.icon&&j.ver?`https://ddragon.leagueoflegends.com/cdn/${j.ver}/img/profileicon/${p.icon}.png`:'';
  return `<div class="row"><div class="pos">${['🥇','🥈','🥉'][i]||i+1}</div><div class="av"><img src="${ic}" alt=""><div>
  <div class="nm"><a target="_blank" rel="noopener" href="https://www.op.gg/summoners/${p.region}/${encodeURIComponent(nm)}-${encodeURIComponent(tg)}">${e(nm)}<span class="rk">#${e(tg)}</span></a></div>
  <div class="rk">${fmt(p.now)}${p.now?` · ${p.now.w}W ${p.now.l}L`:''}${p.err?' · ⚠️ '+e(p.err):''}</div></div></div>
  <div class="gain ${g>=0?'up':'dn'}">${g==null?'–':(g>=0?'+':'')+g}<small>LP netos</small></div></div>`}).join('');
 u.textContent='Actualizado '+new Date(j.updated).toLocaleTimeString();
}
load();setInterval(load,60000);
</script></body></html>
