<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloQ Challenge · Amigos</title><style>
:root{--bg:#0d0f0a;--card:#161a10;--line:#2a3020;--tx:#f2f5e8;--mut:#8b9578;--ac:#E9FF1F;--up:#5dff8f;--dn:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}h1{margin:0;font-size:28px}h1 span{background:var(--ac);color:#0d0f0a;padding:0 8px;border-radius:6px}
.sub{color:var(--mut);margin:6px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:var(--mut)}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;min-height:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row:first-child{border-color:var(--ac)}.pos{font-size:20px;font-weight:800;text-align:center}.av{display:flex;gap:10px;align-items:center}
.av img{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--line)}.nm{font-weight:700}.nm a{color:inherit;text-decoration:none}
.rk{color:var(--mut);font-size:13px}.gain{text-align:right;font-weight:800;font-size:18px}.gain small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--ac);color:#0d0f0a;border-color:var(--ac);font-weight:700}.emb{width:240px;height:240px;object-fit:contain;display:block;margin:-62px 0 -54px}.rank{display:flex;flex-direction:column;align-items:center;min-width:240px}.rank small{font-size:34px;font-weight:800;color:var(--tx)!important;margin-top:0}.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
@media(max-width:640px){.emb{width:150px;height:150px;margin:-38px 0 -34px}.rank{min-width:150px}.rank small{font-size:22px!important}}</style></head><body><main>
<h1>SoloQ <span>Challenge</span></h1><p class="sub">Quién sube más hasta el 31 de diciembre 🍻</p>
<div class="stats"><div class="stat"><b id="d">–</b><small>días restantes</small></div><div class="stat"><b id="n">–</b><small>jugadores</small></div><div class="stat"><b id="t">–</b><small>líder</small></div></div>
<div class="tabs"><button id="b1" class="on">Progreso (LP ganados)</button><button id="b2">Elo actual</button></div><div id="l"></div><div class="foot" id="u"></div></main><script>
const TN={IRON:'Hierro',BRONZE:'Bronce',SILVER:'Plata',GOLD:'Oro',PLATINUM:'Platino',EMERALD:'Esmeralda',DIAMOND:'Diamante',MASTER:'Master',GRANDMASTER:'Grandmaster',CHALLENGER:'Challenger'};
const fmt=r=>r?`${TN[r.tier]}${r.tier.match(/MASTER|CHALL/)?'':' '+r.rank} · ${r.lp} LP`:'Sin rango';
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TI=['IRON','BRONZE','SILVER','GOLD','PLATINUM','EMERALD','DIAMOND','MASTER','GRANDMASTER','CHALLENGER'],DV={IV:0,III:1,II:2,I:3};
const elo=r=>{if(!r)return -1;const i=TI.indexOf(r.tier);return i>=7?2800+r.lp:i*400+DV[r.rank]*100+r.lp};
const URLS=[t=>`https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${t}.png`,t=>`https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-shared-components/global/default/emblem-${t}.png`];
const EC={IRON:'#8a7f77',BRONZE:'#b07a4f',SILVER:'#b4c0c8',GOLD:'#e8c14a',PLATINUM:'#4fc9b0',EMERALD:'#3fd47a',DIAMOND:'#7aa7ff',MASTER:'#c06bff',GRANDMASTER:'#ff6b6b',CHALLENGER:'#ffd76b'};
const rname=r=>TN[r.tier]+(TI.indexOf(r.tier)>=7?'':' '+r.rank);
function fb(el){const n=+el.dataset.n+1,t=el.dataset.t;if(URLS[n]){el.dataset.n=n;el.src=URLS[n](t.toLowerCase());return}
el.outerHTML=`<svg class="emb" viewBox="0 0 48 48"><path d="M24 3 42 10v14c0 10-7 18-18 22C13 42 6 34 6 24V10z" fill="${EC[t]}" stroke="rgba(0,0,0,.35)" stroke-width="2"/><path d="M24 14l8 10-8 10-8-10z" fill="rgba(255,255,255,.55)"/></svg>`}
let mode='gain',last=null;
b1.onclick=()=>{mode='gain';b1.className='on';b2.className='';draw()};
b2.onclick=()=>{mode='elo';b2.className='on';b1.className='';draw()};
async function load(){last=await (await fetch('/api/players')).json();draw()}
function draw(){
 const j=last;
 const ps=j.players.sort((a,b)=>mode==='elo'?elo(b.now)-elo(a.now):((b.gain??-1e9)-(a.gain??-1e9))||(elo(b.now)-elo(a.now)));
 n.textContent=ps.length;t.textContent=ps[0]?ps[0].riotId.split('#')[0]:'–';
 d.textContent=Math.max(0,Math.ceil((new Date('2026-12-31T23:59:59')-new Date())/864e5));
 l.innerHTML=ps.map((p,i)=>{const [nm,tg]=p.riotId.split('#');const g=p.gain;
  const ic=p.icon&&j.ver?`https://ddragon.leagueoflegends.com/cdn/${j.ver}/img/profileicon/${p.icon}.png`:'';
  return `<div class="row"><div class="pos">${['🥇','🥈','🥉'][i]||i+1}</div><div class="av"><img src="${ic}" alt=""><div>
  <div class="nm"><a target="_blank" rel="noopener" href="https://www.op.gg/summoners/${p.region}/${encodeURIComponent(nm)}-${encodeURIComponent(tg)}">${e(nm)}<span class="rk">#${e(tg)}</span></a></div>
  <div class="rk">${fmt(p.now)}${p.now?` · ${p.now.w}W ${p.now.l}L`:''}${p.err?' · ⚠️ '+e(p.err):''}</div></div></div>
  ${mode==='elo'?`<div class="gain rank">${p.now?`<img class="emb" data-n="0" data-t="${p.now.tier}" src="${URLS[0](p.now.tier.toLowerCase())}" onerror="fb(this)" alt="">`:'–'}<small>${p.now?rname(p.now):'Sin rango'}</small></div>`:`<div class="gain ${g>=0?'up':'dn'}">${g==null?'–':(g>=0?'+':'')+g}<small>LP netos</small></div>`}</div>`}).join('');
 u.textContent='Actualizado '+new Date(j.updated).toLocaleTimeString();
}
load();setInterval(load,60000);
</script></body></html>
